name: Update Airbnb availability

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check calendar secret
        id: calendar-secret
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: |
          if [ -z "$AIRBNB_ICAL_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AIRBNB_ICAL_URL is not configured. Skipping availability update."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate availability data
        if: steps.calendar-secret.outputs.configured == 'true'
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: python scripts/update_availability.py

      - name: Commit updated availability
        if: steps.calendar-secret.outputs.configured == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Airbnb availability
          file_pattern: availability.json
