name: Update Airbnb availability

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: airbnb-calendar-update
  cancel-in-progress: false

jobs:
  update-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Test calendar rules
        run: |
          python -m unittest discover -s scripts -p 'test_availability.py'
          node scripts/test_pricing.cjs

      - name: Check calendar secret
        id: calendar-secret
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: |
          if [ -z "$AIRBNB_ICAL_URL" ]; then
            echo "Calendar secret is missing. Update failed."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate availability data
        if: steps.calendar-secret.outputs.configured == 'true'
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: python scripts/update_availability.py

      - name: Commit updated availability
        if: steps.calendar-secret.outputs.configured == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Airbnb availability
          file_pattern: availability.json

      - name: Request website publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds --silent

      - name: Verify public calendar
        run: python scripts/verify_availability_live.py
